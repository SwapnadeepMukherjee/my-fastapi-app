name: Deploy to Amazon ECR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}                   # "ap-south-1"
  ECR_REPOSITORY: my-fastapi-app                       # Your repo name
  IMAGE_TAG: ${{ github.sha }}                         # Unique commit hash

# Core Security Principle: Minimize GitHub Token Privileges globally permissions:
permissions:
  id-token: write   # REQUIRED for requesting the OIDC JWT
  contents: read    # Required for actions/checkout

jobs:
  validate:
    name: Python Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4

      with:
        python-version: 3.11
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov httpx

    - name: Lint Python (flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run tests with coverage
      run: python -m pytest --cov=app tests/ --cov-fail-under=80
        
  build-and-deploy:
    name: Build & Push Docker Image to AWS ECR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Authenticate with AWS via OpenID Connect (OIDC):
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Authenticate Docker CLI against private ECR Registry:
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Set up Docker Buildx for advanced layer caching options
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3

      # Build, tag, and push image to Amazon ECR:
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Build the image with two tags: Unique SHA and Latest
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          # Push both tags
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "::notice::Image pushed successfully to $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"